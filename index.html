<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>프로모션 캘린더</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PlayC 캘린더">
<link rel="apple-touch-icon" href="icon_560.png">
<meta name="theme-color" content="#FDE6B1">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nanum Gothic', sans-serif; background: #F7F4EE; color: #3D3730; font-size: 15px; }

  /* ── 모바일 기본 레이아웃 ── */
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px; }
  .pc-layout { display: none; }

  /* ── PC 레이아웃 (768px 이상) ── */
  @media (min-width: 768px) {
    body { overflow: hidden; height: 100vh; }
    .wrap { display: none; }
    .pc-layout { display: flex; flex-direction: column; height: 100vh; max-width: 1200px; margin: 0 auto; padding: 12px; gap: 10px; }
    .pc-header { background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 16px; padding: 14px 18px; box-shadow: 0 2px 8px rgba(180,160,120,0.1); flex-shrink: 0; display: flex; align-items: flex-start; gap: 16px; }
    .pc-header-left { display: flex; flex-direction: column; gap: 8px; width: calc(50% - 13px); flex-shrink: 0; }
    .pc-header h1 { font-size: 17px; font-weight: 800; color: #5C5040; }
    .pc-header-right { flex: 1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-content: flex-start; padding-top: 4px; }
    .pc-season-display { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .pc-season-row { display: flex; align-items: center; gap: 6px; }
    .pc-nav { display: flex; gap: 8px; align-items: center; width: 100%; }
    .pc-nav select { flex: 1; padding: 7px 6px; border: 1.5px solid #FFF1D1; border-radius: 11px; font-size: 13px; font-weight: 800; background: #FFFDF7; color: #5C5040; appearance: none; text-align: center; font-family: 'Nanum Gothic', sans-serif; }
    .pc-nav .nav-arrow { width: 30px; height: 30px; font-size: 16px; }
    .pc-tab-bar { display: flex; background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 12px; padding: 4px; gap: 3px; box-shadow: 0 1px 5px rgba(180,160,120,0.08); flex-shrink: 0; }
    .pc-tab-bar button { flex: 1; padding: 8px 12px; font-size: 13px; font-weight: 700; background: transparent; border: none; cursor: pointer; color: #5a5959; border-radius: 9px; transition: all 0.15s; font-family: 'Nanum Gothic', sans-serif; white-space: nowrap; }
    .pc-tab-bar button.active { background: #FDE6B1; color: #5C5040; }
    .pc-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }
    .pc-left { display: flex; flex-direction: column; min-height: 0; }
    .pc-right { overflow-y: auto; min-height: 0; }
    .pc-cal-card { background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 16px; padding: 14px; box-shadow: 0 1px 6px rgba(180,160,120,0.08); flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .pc-cal-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .pc-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; flex: 1; }
    .pc-day-label { text-align: center; font-size: 11px; font-weight: 800; color: #5a5959; padding: 4px 0 6px; }
    .pc-day-label:first-child { color: #dc4038; }
    .pc-day-label:last-child  { color: #4A7AAA; }
    .pc-cell { background: #FFFDF7; border: 1.5px solid #EDE8DC; border-radius: 8px; padding: 4px; cursor: pointer; transition: background 0.1s; overflow: hidden; display: flex; flex-direction: column; }
    .pc-cell:hover { background: #FFF5DC; }
    .pc-cell.pc-empty { background: transparent; border-color: transparent; cursor: default; }
    .pc-cell.pc-today { border: 2px solid #FDE6B1; background: #FAF7EE; }
    .pc-cell.pc-selected { border: 2px solid #C0A875 !important; background: #FFF5DC !important; }
    .pc-dn { font-size: 11px; font-weight: 800; line-height: 1; margin-bottom: 2px; color: #5C5040; }
    .pc-cell.pc-sun .pc-dn { color: #dc4038; }
    .pc-cell.pc-sat .pc-dn { color: #4A7AAA; }
    .pc-cell.pc-hol .pc-dn { color: #dc4038; }
    .pc-promo-pill { font-size: 7.5px; padding: 1px 3px; border-radius: 3px; margin-bottom: 1px; white-space: normal; line-height: 1.3; font-weight: 700; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pc-detail-empty { display: flex; align-items: center; justify-content: center; min-height: 160px; color: #C8BCA8; font-size: 14px; font-weight: 700; text-align: center; }
  }

  /* ── 공통 컴포넌트 ── */
  .header { background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 18px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(180,160,120,0.1); }
  .header h1 { font-size: 17px; font-weight: 800; color: #5C5040; margin-bottom: 8px; }
  .season-display { display: flex; flex-direction: column; gap: 4px; }
  .season-display-row { display: flex; align-items: center; gap: 7px; }
  .season-badge { font-size: 10px; font-weight: 800; color: #fff; border-radius: 20px; padding: 2px 8px; white-space: nowrap; min-width: 58px; text-align: center; }
  .season-badge.low  { background: #7EB89A; }
  .season-badge.high { background: #E0A458; }
  .season-badge.gold { background: #C0834A; }
  .season-display-text { font-size: 11px; color: #7A6A50; font-weight: 700; }
  .nav { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .nav select { flex: 1; padding: 8px 6px; border: 1.5px solid #FFF1D1; border-radius: 11px; font-size: 14px; font-weight: 800; background: #FFFDF7; color: #5C5040; appearance: none; text-align: center; font-family: 'Nanum Gothic', sans-serif; }
  .nav-arrow { background: #fff2d4; border: none; border-radius: 10px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #7A6A50; font-weight: 800; }
  .nav-arrow:active { background: #DDD8CC; }
  .tab-bar { display: flex; background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 14px; padding: 4px; margin-bottom: 10px; gap: 3px; box-shadow: 0 1px 5px rgba(180,160,120,0.08); }
  .tab-bar button { flex: 1; padding: 8px 2px; font-size: 11px; font-weight: 700; background: transparent; border: none; cursor: pointer; color: #5a5959; border-radius: 10px; transition: all 0.15s; font-family: 'Nanum Gothic', sans-serif; }
  .tab-bar button.active { background: #FDE6B1; color: #5C5040; }
  .card { background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 16px; padding: 14px; box-shadow: 0 1px 6px rgba(180,160,120,0.08); margin-bottom: 10px; }

  /* 달력 (모바일) */
  .cal-wrap { touch-action: pan-y; user-select: none; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .day-label { text-align: center; font-size: 11px; font-weight: 800; color: #5a5959; padding: 4px 0 6px; }
  .day-label:first-child { color: #dc4038; }
  .day-label:last-child  { color: #4A7AAA; }
  .cell { min-height: 74px; background: #FFFDF7; border: 1.5px solid #EDE8DC; border-radius: 9px; padding: 4px 3px; cursor: pointer; transition: background 0.1s; overflow: hidden; }
  .cell:active { background: #F0EAD8; }
  .cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .cell.today { border: 2px solid #FDE6B1; background: #FAF7EE; }
  .cell.selected-date { border: 2px solid #C0A875 !important; background: #FFF5DC !important; }
  .dn { font-size: 12px; font-weight: 800; line-height: 1; margin-bottom: 3px; color: #5C5040; }
  .cell.sun .dn { color: #dc4038; }
  .cell.sat .dn { color: #4A7AAA; }
  .cell.hol .dn { color: #dc4038; }
  .promo-pill { font-size: 8px; padding: 2px 3px; border-radius: 4px; margin-bottom: 2px; white-space: normal; line-height: 1.3; font-weight: 700; word-break: keep-all; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .swipe-hint { text-align: center; font-size: 11px; color: #C8BCA8; margin-top: 8px; }

  /* 커스텀 날짜 입력 */
  .date-input-wrap { position: relative; }
  .date-input-fields { display: flex; align-items: center; gap: 4px; padding: 9px 12px; border: 1.5px solid #FDE6B1; border-radius: 11px; background: #FFFDF7; }
  .date-input-fields:focus-within { border-color: #C0A875; }
  .date-input-fields input { border: none; background: transparent; outline: none; font-family: 'Nanum Gothic', sans-serif; font-size: 14px; color: #3D3730; text-align: center; padding: 0; }
  .date-input-fields input::placeholder { color: #C8BCA8; }
  .date-y { width: 42px; }
  .date-m { width: 24px; }
  .date-d { width: 24px; }
  .date-sep { color: #C8BCA8; font-size: 13px; font-weight: 700; }
  .date-cal-btn { margin-left: auto; background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 0 0 0 6px; color: #C0A875; }
  .date-picker-popup { display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #FFFDF7; border: 1.5px solid #FFF1D1; border-radius: 14px; padding: 12px; box-shadow: 0 4px 16px rgba(180,160,120,0.18); z-index: 50; }
  .date-picker-popup.open { display: block; }
  .dp-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .dp-nav button { background: #fff2d4; border: none; border-radius: 8px; width: 28px; height: 28px; font-size: 15px; cursor: pointer; color: #7A6A50; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .dp-title { font-size: 13px; font-weight: 800; color: #5C5040; }
  .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dp-dlabel { text-align: center; font-size: 10px; font-weight: 800; color: #B0A090; padding: 2px 0 4px; }
  .dp-dlabel:first-child { color: #dc4038; }
  .dp-dlabel:last-child  { color: #4A7AAA; }
  .dp-cell { text-align: center; font-size: 11px; font-weight: 700; padding: 5px 2px; border-radius: 6px; cursor: pointer; color: #5C5040; }
  .dp-cell:hover { background: #FFF1D1; }
  .dp-cell.empty { cursor: default; }
  .dp-cell.dp-today { background: #FFF1D1; font-weight: 800; }
  .dp-cell.dp-selected { background: #C0A875 !important; color: #fff !important; }
  .dp-cell.dp-sun { color: #dc4038; }
  .dp-cell.dp-sat { color: #4A7AAA; }
  .dp-cell.dp-hol { color: #dc4038; }

  /* 폼 */
  .section-title { font-size: 11px; font-weight: 800; color: #A09070; letter-spacing: 0.04em; margin: 14px 0 8px; }
  .section-title:first-child { margin-top: 0; }
  .form-group { margin-bottom: 10px; }
  .form-group label { font-size: 13px; color: #7A6A50; display: block; margin-bottom: 5px; font-weight: 700; }
  .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1.5px solid #FDE6B1; border-radius: 11px; font-size: 14px; background: #FFFDF7; color: #3D3730; outline: none; font-family: 'Nanum Gothic', sans-serif; }
  .form-group input:focus, .form-group select:focus { border-color: #C0A875; }
  .product-entry { background: #FAF7EF; border: 1.5px solid #FDE6B1; border-radius: 12px; padding: 12px; margin-bottom: 8px; position: relative; }
  .del-btn { position: absolute; top: 8px; right: 10px; background: #EDE8DC; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; color: #A09070; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
  .add-product-btn { width: 100%; padding: 10px; font-size: 13px; border: 1.5px dashed #C8BCA8; border-radius: 11px; background: transparent; cursor: pointer; color: #A09070; margin-bottom: 10px; font-weight: 700; font-family: 'Nanum Gothic', sans-serif; }
  .submit-btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 800; background: #FDE6B1; color: #5C5040; border: none; border-radius: 12px; cursor: pointer; font-family: 'Nanum Gothic', sans-serif; }
  .submit-btn:active { background: #f5d48a; }
  .submit-btn:disabled { background: #D0C8BC; color: #fff; cursor: default; }
  .cancel-btn { width: 100%; padding: 11px; font-size: 14px; font-weight: 700; background: #EDE8DC; color: #7A6A50; border: none; border-radius: 12px; cursor: pointer; margin-top: 8px; font-family: 'Nanum Gothic', sans-serif; }

  /* 색상 선택 */
  .color-picker-wrap { margin-bottom: 10px; }
  .color-picker-wrap label { font-size: 13px; color: #7A6A50; display: block; margin-bottom: 8px; font-weight: 700; }
  .color-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: transform 0.1s, border-color 0.1s; flex-shrink: 0; }
  .swatch.selected { border-color: #5C5040; transform: scale(1.15); }

  /* 목록 */
  .list-filter { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .list-filter select { flex: 1; padding: 8px 10px; border: 1.5px solid #FDE6B1; border-radius: 11px; font-size: 13px; font-weight: 700; background: #FFFDF7; color: #5C5040; font-family: 'Nanum Gothic', sans-serif; outline: none; appearance: none; text-align: center; }
  .list-swipe-wrap { touch-action: pan-y; user-select: none; }
  .list-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1.5px dashed #EDE8DC; }
  .list-item:last-child { border-bottom: none; }
  .color-bar { width: 4px; border-radius: 2px; align-self: stretch; flex-shrink: 0; min-height: 40px; }
  .list-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; margin-left: auto; }
  .list-edit, .list-del { background: transparent; border: none; cursor: pointer; font-size: 17px; padding: 4px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 700; display: inline-block; margin: 2px 2px 2px 0; }

  /* 검색 */
  .search-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid #FDE6B1; border-radius: 11px; font-size: 14px; background: #FFFDF7; color: #3D3730; outline: none; font-family: 'Nanum Gothic', sans-serif; }
  .search-bar input:focus { border-color: #C0A875; }
  .search-year-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .search-year-btn { padding: 5px 14px; border: 1.5px solid #FDE6B1; border-radius: 20px; font-size: 12px; font-weight: 700; background: #FFFDF7; color: #7A6A50; cursor: pointer; font-family: 'Nanum Gothic', sans-serif; }
  .search-year-btn.active { background: #FDE6B1; color: #5C5040; border-color: #C0A875; }
  .search-result-count { font-size: 12px; color: #A09070; font-weight: 700; margin-bottom: 8px; }

  /* 설정 */
  .season-add-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
  .season-select { padding: 7px 8px; border: 1.5px solid #FDE6B1; border-radius: 9px; font-size: 12px; font-family: 'Nanum Gothic', sans-serif; color: #5C5040; background: #FFFDF7; outline: none; font-weight: 800; }
  .season-date-input { flex: 1; padding: 7px 6px; border: 1.5px solid #FDE6B1; border-radius: 9px; font-size: 12px; font-family: 'Nanum Gothic', sans-serif; color: #5C5040; background: #FFFDF7; outline: none; }
  .season-tilde { font-size: 12px; color: #5a5959; font-weight: 700; flex-shrink: 0; }
  .season-add-btn { padding: 7px 11px; background: #FDE6B1; border: none; border-radius: 9px; font-size: 12px; font-weight: 800; color: #5C5040; cursor: pointer; white-space: nowrap; font-family: 'Nanum Gothic', sans-serif; flex-shrink: 0; }
  .season-list { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .season-item { display: flex; align-items: center; justify-content: space-between; background: #FAF7EF; border: 1.5px solid #FDE6B1; border-radius: 9px; padding: 7px 10px; }
  .season-item-left { display: flex; align-items: center; gap: 7px; }
  .season-item-badge { font-size: 10px; font-weight: 800; color: #fff; border-radius: 20px; padding: 2px 8px; white-space: nowrap; min-width: 52px; text-align: center; }
  .season-item-badge.low  { background: #7EB89A; }
  .season-item-badge.high { background: #E0A458; }
  .season-item-badge.gold { background: #C0834A; }
  .season-item-text { font-size: 12px; color: #5a5959; font-weight: 700; }
  .season-item-del { background: transparent; border: none; cursor: pointer; font-size: 15px; padding: 2px 4px; color: #C8BCA8; }
  .holiday-input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .holiday-input-row input { flex: 1; padding: 9px 10px; border: 1.5px solid #FDE6B1; border-radius: 10px; font-size: 13px; background: #FFFDF7; color: #3D3730; outline: none; font-family: 'Nanum Gothic', sans-serif; }
  .holiday-add-btn { padding: 9px 14px; background: #FDE6B1; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; color: #5C5040; cursor: pointer; white-space: nowrap; font-family: 'Nanum Gothic', sans-serif; }
  .holiday-list { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .holiday-item { display: flex; align-items: center; justify-content: space-between; background: #FAF7EF; border: 1.5px solid #FDE6B1; border-radius: 9px; padding: 7px 10px; }
  .holiday-item-date { font-size: 12px; color: #dc4038; font-weight: 800; margin-right: 6px; }
  .holiday-item-text { font-size: 13px; color: #5a5959; font-weight: 700; }
  .holiday-del-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 2px 4px; color: #C8BCA8; }

  /* 모달 (모바일만) */
  .modal-bg { position: fixed; inset: 0; background: rgba(60,50,40,0.35); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal { background: #FFFDF7; border-radius: 22px 22px 0 0; width: 100%; max-width: 480px; padding: 16px 16px 36px; max-height: 82vh; overflow-y: auto; }
  .modal-handle { width: 38px; height: 4px; background: #EDE8DC; border-radius: 2px; margin: 0 auto 16px; }
  .promo-card { border: 1.5px solid #EDE8DC; border-radius: 13px; padding: 12px 14px; margin-bottom: 10px; }
  .promo-card .pname { font-size: 15px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; color: #3D3730; }
  .promo-card .pdate { font-size: 12px; color: #B0A090; margin-bottom: 8px; font-weight: 700; }
  .product-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #EDE8DC; }
  .product-row:last-child { border-bottom: none; }
  .product-row .ptype { color: #7A6A50; font-weight: 700; }

  .edit-banner { background: #FFF8E8; border: 1.5px solid #E8C87A; border-radius: 11px; padding: 9px 14px; font-size: 13px; color: #7A5C00; margin-bottom: 10px; text-align: center; font-weight: 700; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #5C5040; color: #fff; padding: 10px 22px; border-radius: 30px; font-size: 13px; font-weight: 700; z-index: 300; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 32px 0; color: #C8BCA8; font-size: 14px; font-weight: 700; }
  .spinner { width: 24px; height: 24px; border: 2.5px solid #EDE8DC; border-top-color: #C0A875; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 32px 0; color: #C8BCA8; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>

<!-- ══ 모바일 레이아웃 ══ -->
<div class="wrap">
  <div class="header">
    <h1>🗓 프로모션 캘린더</h1>
    <div class="season-display" id="seasonDisplay"></div>
    <div class="nav">
      <button class="nav-arrow" onclick="changeMonth(-1)">‹</button>
      <select id="selYear"></select>
      <select id="selMonth"></select>
      <button class="nav-arrow" onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="active" onclick="switchTab('cal')">🗓 달력</button>
    <button onclick="switchTab('form')">✏️ 등록</button>
    <button onclick="switchTab('list')">📋 목록</button>
    <button onclick="switchTab('search')">🔍 검색</button>
    <button onclick="switchTab('setting')">⚙️ 설정</button>
  </div>
  <div class="card" id="tabCal">
    <div class="cal-wrap" id="calWrap">
      <div class="cal-grid" id="calGrid"></div>

const COLORS=['#e55d62','#e5c4bf','#faab23','#fae390','#40916C','#87b27c','#a3bb95','#005BB5','#30B0C7','#7db0c7','#9dccdc','#7774b6','#bebfd7','#9968a1','#b780a9','#cfb3c5','#FF69B4','#fcc1d3'];

function getAutoColor(type){let h=2166136261;for(let i=0;i<type.length;i++){h^=type.charCodeAt(i);h=(h*16777619)>>>0;}return COLORS[h%COLORS.length];}
function getColor(p){if(typeof p==='string')return getAutoColor(p);return p.color||getAutoColor(p.type);}
function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function showToast(msg,d=2200){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d);}
function isPC(){return window.innerWidth>=768;}

/* ── 색상 스와치 ── */
let selectedColor='',pcSelectedColor='';
function renderSwatches(target='mob'){
  const id=target==='pc'?'pcColorSwatches':'colorSwatches';
  const sel=target==='pc'?pcSelectedColor:selectedColor;
  document.getElementById(id).innerHTML=COLORS.map(c=>`<div class="swatch${c===sel?' selected':''}" style="background:${c};" onclick="${target==='pc'?'pcSelectSwatch':'selectSwatch'}('${c}')"></div>`).join('');
}
function selectSwatch(c){selectedColor=selectedColor===c?'':c;renderSwatches('mob');}
function pcSelectSwatch(c){pcSelectedColor=pcSelectedColor===c?'':c;renderSwatches('pc');}

/* ── 날짜 입력 ── */
const dpState={start:{y:new Date().getFullYear(),m:new Date().getMonth()},end:{y:new Date().getFullYear(),m:new Date().getMonth()},pcStart:{y:new Date().getFullYear(),m:new Date().getMonth()},pcEnd:{y:new Date().getFullYear(),m:new Date().getMonth()}};

function setupDateInputs(){
  [['fStartY','fStartM','fStartD'],['fEndY','fEndM','fEndD'],['pcFStartY','pcFStartM','pcFStartD'],['pcFEndY','pcFEndM','pcFEndD']].forEach(([y,m,d])=>{
    const ey=document.getElementById(y),em=document.getElementById(m),ed=document.getElementById(d);
    if(!ey)return;
    ey.addEventListener('input',()=>{if(ey.value.length===4)em.focus();});
    em.addEventListener('input',()=>{if(em.value.length===2)ed.focus();});
  });
  document.addEventListener('click',e=>{
    ['start','end','pcStart','pcEnd'].forEach(w=>{
      const wrapId=w==='start'?'startWrap':w==='end'?'endWrap':w==='pcStart'?'pcStartWrap':'pcEndWrap';
      const el=document.getElementById(wrapId);
      if(el&&!el.contains(e.target))closePicker(w);
    });
  });
}

function getDateVal(which){
  const ids={start:['fStartY','fStartM','fStartD'],end:['fEndY','fEndM','fEndD'],pcStart:['pcFStartY','pcFStartM','pcFStartD'],pcEnd:['pcFEndY','pcFEndM','pcFEndD']};
  const [yId,mId,dId]=ids[which]||[];
  const y=document.getElementById(yId)?.value||'';
  const m=document.getElementById(mId)?.value||'';
  const d=document.getElementById(dId)?.value||'';
  if(y.length===4&&m.length>=1&&d.length>=1)return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  return '';
}
function setDateVal(which,dateStr){
  const ids={start:['fStartY','fStartM','fStartD'],end:['fEndY','fEndM','fEndD'],pcStart:['pcFStartY','pcFStartM','pcFStartD'],pcEnd:['pcFEndY','pcFEndM','pcFEndD']};
  const [yId,mId,dId]=ids[which]||[];
  const parts=dateStr.split('-');
  const ey=document.getElementById(yId),em=document.getElementById(mId),ed=document.getElementById(dId);
  if(ey)ey.value=parts[0]||'';
  if(em)em.value=parts[1]?parseInt(parts[1]).toString():'';
  if(ed)ed.value=parts[2]?parseInt(parts[2]).toString():'';
}
function clearDateVal(which){
  const ids={start:['fStartY','fStartM','fStartD'],end:['fEndY','fEndM','fEndD'],pcStart:['pcFStartY','pcFStartM','pcFStartD'],pcEnd:['pcFEndY','pcFEndM','pcFEndD']};
  const [yId,mId,dId]=ids[which]||[];
  [yId,mId,dId].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}
function togglePicker(which){
  const pid=`picker${which.charAt(0).toUpperCase()+which.slice(1)}`;
  const isOpen=document.getElementById(pid)?.classList.contains('open');
  ['start','end','pcStart','pcEnd'].forEach(w=>closePicker(w));
  if(!isOpen){
    const cur=getDateVal(which);
    if(cur){const pts=cur.split('-');dpState[which].y=+pts[0];dpState[which].m=+pts[1]-1;}
    renderDpGrid(which);
    document.getElementById(pid)?.classList.add('open');
  }
}
function closePicker(which){
  const pid=`picker${which.charAt(0).toUpperCase()+which.slice(1)}`;
  document.getElementById(pid)?.classList.remove('open');
}
function dpMove(which,dir){
  dpState[which].m+=dir;
  if(dpState[which].m<0){dpState[which].m=11;dpState[which].y--;}
  if(dpState[which].m>11){dpState[which].m=0;dpState[which].y++;}
  renderDpGrid(which);
}
function renderDpGrid(which){
  const y=dpState[which].y,m=dpState[which].m;
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const pid=`picker${which.charAt(0).toUpperCase()+which.slice(1)}`;
  document.getElementById(`dpTitle${which.charAt(0).toUpperCase()+which.slice(1)}`).textContent=`${y}년 ${mn[m]}`;
  const grid=document.getElementById(`dpGrid${which.charAt(0).toUpperCase()+which.slice(1)}`);
  if(!grid)return;grid.innerHTML='';
  const fixedH=getFixedHolidays(y);const userH=new Set(holidays.map(h=>h.date));const allH=new Set([...fixedH,...userH]);
  ['일','월','화','수','목','금','토'].forEach(d=>{const el=document.createElement('div');el.className='dp-dlabel';el.textContent=d;grid.appendChild(el);});
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  const todayStr=dStr(today.getFullYear(),today.getMonth(),today.getDate());
  const selStr=getDateVal(which);
  for(let i=0;i<first;i++){const el=document.createElement('div');el.className='dp-cell empty';grid.appendChild(el);}
  for(let d=1;d<=last;d++){
    const ds=dStr(y,m,d),dow=(first+d-1)%7,isH=allH.has(ds);
    let cls='dp-cell';
    if(dow===0||isH)cls+=' dp-sun';else if(dow===6)cls+=' dp-sat';
    if(isH)cls+=' dp-hol';if(ds===todayStr)cls+=' dp-today';if(ds===selStr)cls+=' dp-selected';
    const el=document.createElement('div');el.className=cls;el.textContent=d;
    el.addEventListener('click',()=>{setDateVal(which,ds);closePicker(which);});
    grid.appendChild(el);
  }
}

/* ── 데이터 ── */
let promos=[],seasons=[],holidays=[],productCount=0,pcProductCount=0,isSaving=false,editIdx=-1,pcEditIdx=-1;
const today=new Date();

async function loadData(){
  try{
    const res=await fetch(BASE+'/latest',{headers:{'X-Master-Key':API_KEY}});
    const json=await res.json();
    promos=json.record?.promos||[];
    const raw=json.record?.seasons;
    if(Array.isArray(raw))seasons=raw;
    else if(raw&&typeof raw==='object'){
      seasons=[];
      if(raw.lowStart&&raw.lowEnd)seasons.push({type:'low',start:raw.lowStart,end:raw.lowEnd});
      if(raw.highStart&&raw.highEnd)seasons.push({type:'high',start:raw.highStart,end:raw.highEnd});

/* ── 공휴일 ── */
function getFixedHolidays(year){
  const h=new Set();const add=(m,d)=>h.add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1);add(3,1);add(5,5);add(6,6);add(8,15);add(10,3);add(10,9);add(12,25);
  const l=lunarToSolar(year);l.seollal.forEach(d=>h.add(d));l.chuseok.forEach(d=>h.add(d));l.buddha.forEach(d=>h.add(d));return h;
}
function lunarToSolar(year){
  const t={2024:{seollal:['2024-02-09','2024-02-10','2024-02-11','2024-02-12'],chuseok:['2024-09-16','2024-09-17','2024-09-18'],buddha:['2024-05-15']},2025:{seollal:['2025-01-28','2025-01-29','2025-01-30'],chuseok:['2025-10-05','2025-10-06','2025-10-07','2025-10-08'],buddha:['2025-05-05']},2026:{seollal:['2026-02-17','2026-02-18','2026-02-19'],chuseok:['2026-09-24','2026-09-25','2026-09-26'],buddha:['2026-05-24']},2027:{seollal:['2027-02-06','2027-02-07','2027-02-08'],chuseok:['2027-09-14','2027-09-15','2027-09-16'],buddha:['2027-05-13']}};
  return t[year]||{seollal:[],chuseok:[],buddha:[]};
}

  if(start>end){showToast('종료일이 시작일보다 빠릅니다.');return;}
  const products=productEntries.map(id=>{const name=document.getElementById('pname_'+id)?.value,season=document.getElementById('pseason_'+id)?.value,price=document.getElementById('pprice_'+id)?.value;return name&&price?{name,season,price}:null;}).filter(Boolean);
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='저장 중...';
  const promoData={start,end,type,products};
  if(selectedColor&&selectedColor!==getAutoColor(type))promoData.color=selectedColor;
  if(editIdx>=0)promos[editIdx]=promoData;else promos.push(promoData);
  await saveAll();showToast(editIdx>=0?'✅ 수정됐습니다!':'✅ 등록됐습니다!');
  editIdx=-1;selectedColor='';clearDateVal('start');clearDateVal('end');document.getElementById('fType').value='';document.getElementById('productList').innerHTML='';productEntries=[];productCount=0;renderSwatches('mob');
  document.getElementById('editBanner').style.display='none';btn.disabled=false;btn.textContent='프로모션 등록';document.getElementById('cancelBtn').style.display='none';
  renderCal();renderPcCal();renderList();switchTab('cal');
}
function startCopy(idx){
  const p=promos[idx];editIdx=-1;selectedColor=p.color||'';clearDateVal('start');clearDateVal('end');
  document.getElementById('fType').value=p.type;document.getElementById('productList').innerHTML='';productEntries=[];productCount=0;
  if(p.products?.length)p.products.forEach(pr=>addProduct(pr));renderSwatches('mob');
  document.getElementById('editBanner').style.display='';document.getElementById('editBanner').textContent='📋 복사 모드 — 날짜를 입력하고 등록하세요';
  document.getElementById('submitBtn').textContent='프로모션 등록';document.getElementById('cancelBtn').style.display='';
  switchTab('form');showToast('📋 내용이 복사됐어요! 날짜를 입력해 주세요.');
}

/* ── 상품 (PC) ── */
let pcProductEntries=[];
function pcAddProduct(preset){
  const id=pcProductCount++;pcProductEntries.push(id);
  const div=document.createElement('div');div.className='product-entry';div.id='pcPe_'+id;
  div.innerHTML=`<button class="del-btn" onclick="pcRemoveProduct(${id})">×</button><div class="form-group" style="margin-bottom:8px;padding-right:30px;"><label>상품명</label><select id="pcPname_${id}">${PRODUCT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="form-group" style="margin-bottom:8px;"><label>시즌</label><select id="pcPseason_${id}">${SEASON_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="form-group" style="margin-bottom:0;"><label>가격 (원)</label><input type="number" id="pcPprice_${id}" placeholder="0" inputmode="numeric"></div>`;
  document.getElementById('pcProductList').appendChild(div);
  if(preset){document.getElementById('pcPname_'+id).value=preset.name||PRODUCT_TYPES[0];document.getElementById('pcPseason_'+id).value=preset.season||SEASON_TYPES[0];document.getElementById('pcPprice_'+id).value=preset.price||'';}
}
function pcRemoveProduct(id){document.getElementById('pcPe_'+id)?.remove();pcProductEntries=pcProductEntries.filter(x=>x!==id);}
function pcStartEdit(idx){
  const p=promos[idx];pcEditIdx=idx;
  setDateVal('pcStart',p.start);setDateVal('pcEnd',p.end);
  document.getElementById('pcFType').value=p.type;
  document.getElementById('pcProductList').innerHTML='';pcProductEntries=[];pcProductCount=0;
  if(p.products?.length)p.products.forEach(pr=>pcAddProduct(pr));
  pcSelectedColor=p.color||'';renderSwatches('pc');
  document.getElementById('pcEditBanner').style.display='';document.getElementById('pcEditBanner').textContent='✏️ 수정 모드 — 내용 변경 후 저장하세요';
  document.getElementById('pcSubmitBtn').textContent='수정 저장';document.getElementById('pcCancelBtn').style.display='';
  pcSwitchTab('form');
}
function pcCancelEdit(){
  pcEditIdx=-1;pcSelectedColor='';clearDateVal('pcStart');clearDateVal('pcEnd');
  document.getElementById('pcFType').value='';document.getElementById('pcProductList').innerHTML='';pcProductEntries=[];pcProductCount=0;renderSwatches('pc');
  document.getElementById('pcEditBanner').style.display='none';document.getElementById('pcSubmitBtn').textContent='프로모션 등록';document.getElementById('pcCancelBtn').style.display='none';
  pcSwitchTab('list');
}
async function pcSubmitPromo(){
  const start=getDateVal('pcStart'),end=getDateVal('pcEnd'),type=document.getElementById('pcFType').value.trim();
  if(!start||!end||!type){showToast('시작일, 종료일, 프로모션 구분을 입력해 주세요.');return;}
  if(start>end){showToast('종료일이 시작일보다 빠릅니다.');return;}
  const products=pcProductEntries.map(id=>{const name=document.getElementById('pcPname_'+id)?.value,season=document.getElementById('pcPseason_'+id)?.value,price=document.getElementById('pcPprice_'+id)?.value;return name&&price?{name,season,price}:null;}).filter(Boolean);
  const btn=document.getElementById('pcSubmitBtn');btn.disabled=true;btn.textContent='저장 중...';
  const promoData={start,end,type,products};
  if(pcSelectedColor&&pcSelectedColor!==getAutoColor(type))promoData.color=pcSelectedColor;
  if(pcEditIdx>=0)promos[pcEditIdx]=promoData;else promos.push(promoData);
  await saveAll();showToast(pcEditIdx>=0?'✅ 수정됐습니다!':'✅ 등록됐습니다!');
  pcEditIdx=-1;pcSelectedColor='';clearDateVal('pcStart');clearDateVal('pcEnd');document.getElementById('pcFType').value='';document.getElementById('pcProductList').innerHTML='';pcProductEntries=[];pcProductCount=0;renderSwatches('pc');
  document.getElementById('pcEditBanner').style.display='none';btn.disabled=false;btn.textContent='프로모션 등록';document.getElementById('pcCancelBtn').style.display='none';
  renderCal();renderPcCal();renderList();pcSwitchTab('cal');
}
function pcStartCopy(idx){
  const p=promos[idx];pcEditIdx=-1;pcSelectedColor=p.color||'';clearDateVal('pcStart');clearDateVal('pcEnd');
  document.getElementById('pcFType').value=p.type;document.getElementById('pcProductList').innerHTML='';pcProductEntries=[];pcProductCount=0;
  if(p.products?.length)p.products.forEach(pr=>pcAddProduct(pr));renderSwatches('pc');
  document.getElementById('pcEditBanner').style.display='';document.getElementById('pcEditBanner').textContent='📋 복사 모드 — 날짜를 입력하고 등록하세요';
  document.getElementById('pcSubmitBtn').textContent='프로모션 등록';document.getElementById('pcCancelBtn').style.display='';
  pcSwitchTab('form');showToast('📋 내용이 복사됐어요! 날짜를 입력해 주세요.');
}

/* ── 목록 ── */
function renderList(){
  const ispc=isPC();
  const yEl=document.getElementById(ispc?'pcListYear':'listYear');
  const mEl=document.getElementById(ispc?'pcListMonth':'listMonth');
  if(!yEl||!mEl)return;
  // 양쪽 동기화
  ['listYear','pcListYear'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=yEl.value;});
  ['listMonth','pcListMonth'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=mEl.value;});
  const y=+yEl.value,mVal=mEl.value;
  let filtered=[...promos].map((p,i)=>({...p,idx:i}));
  if(mVal!=='all'){const m=parseInt(mVal),mStart=`${y}-${String(m).padStart(2,'0')}-01`,mEnd=`${y}-${String(m).padStart(2,'0')}-31`;filtered=filtered.filter(p=>p.start<=mEnd&&p.end>=mStart);}
  filtered.sort((a,b)=>a.start.localeCompare(b.start));
  const html=filtered.length?filtered.map(p=>{const c=getColor(p);const prodHtml=p.products?.length?p.products.map(pr=>{const sl=pr.season?pr.season.replace('시즌','')+'   ':'';return `<span class="badge" style="background:${hexToRgba(c,0.12)};color:${c};">${sl}${pr.name} ${Number(pr.price).toLocaleString()}원</span>`;}).join(''):`<span style="font-size:12px;color:#C8BCA8;">상품 없음</span>`;return `<div class="list-item"><div class="color-bar" style="background:${c};"></div><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:800;margin-bottom:2px;color:#5A5959;">${p.type}</div><div style="font-size:12px;color:#B0A090;margin-bottom:6px;font-weight:700;">📆 ${p.start} ~ ${p.end}</div><div>${prodHtml}</div></div><div class="list-actions"><button class="list-edit" onclick="${ispc?'pcStartEdit':'startEdit'}(${p.idx})">✏️</button><button class="list-edit" onclick="${ispc?'pcStartCopy':'startCopy'}(${p.idx})">📋</button><button class="list-del" onclick="deletePromo(${p.idx})">🗑️</button></div></div>`;}).join(''):'<div class="empty-state">해당 기간의 프로모션이 없습니다.</div>';
  ['listView','pcListView'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=html;});
}

async function deletePromo(idx){
  if(!confirm('이 프로모션을 삭제하시겠습니까?'))return;
  promos.splice(idx,1);await saveAll();showToast('🗑 삭제됐습니다.');renderList();renderCal();renderPcCal();
}

/* ── 검색 ── */
let searchYear='all';
function initSearchYearFilter(){
  const years=[...new Set(promos.flatMap(p=>{const ys=[];for(let y=+p.start.slice(0,4);y<=+p.end.slice(0,4);y++)ys.push(y);return ys;}))].sort();
  const allYears=[today.getFullYear()-1,today.getFullYear(),today.getFullYear()+1,today.getFullYear()+2];
  const merged=[...new Set([...allYears,...years])].sort();
  const html=`<button class="search-year-btn${searchYear==='all'?' active':''}" onclick="setSearchYear('all')">전체</button>`+merged.map(y=>`<button class="search-year-btn${searchYear==y?' active':''}" onclick="setSearchYear(${y})">${y}년</button>`).join('');
  ['searchYearFilter','pcSearchYearFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=html;});
}
function setSearchYear(y){searchYear=y;initSearchYearFilter();renderSearch();}
function renderSearch(){
  const ispc=isPC();
  const q=(document.getElementById(ispc?'pcSearchInput':'searchInput')?.value||'').trim().toLowerCase();
  let filtered=[...promos].map((p,i)=>({...p,idx:i}));
  if(searchYear!=='all')filtered=filtered.filter(p=>+p.start.slice(0,4)<=searchYear&&+p.end.slice(0,4)>=searchYear);
  if(q)filtered=filtered.filter(p=>p.type.toLowerCase().includes(q)||(p.products||[]).some(pr=>pr.name.toLowerCase().includes(q)));
  filtered.sort((a,b)=>a.start.localeCompare(b.start));
  const countHtml=`검색 결과 ${filtered.length}건`;
  ['searchResultCount','pcSearchResultCount'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=countHtml;});
  const html=filtered.length?filtered.map(p=>{const c=getColor(p);const prodHtml=p.products?.length?p.products.map(pr=>{const sl=pr.season?pr.season.replace('시즌','')+'   ':'';return `<span class="badge" style="background:${hexToRgba(c,0.12)};color:${c};">${sl}${pr.name} ${Number(pr.price).toLocaleString()}원</span>`;}).join(''):`<span style="font-size:12px;color:#C8BCA8;">상품 없음</span>`;return `<div class="list-item"><div class="color-bar" style="background:${c};"></div><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:800;margin-bottom:2px;color:#5A5959;">${p.type}</div><div style="font-size:12px;color:#B0A090;margin-bottom:6px;font-weight:700;">📆 ${p.start} ~ ${p.end}</div><div>${prodHtml}</div></div><div class="list-actions"><button class="list-edit" onclick="${ispc?'pcStartEdit':'startEdit'}(${p.idx})">✏️</button><button class="list-edit" onclick="${ispc?'pcStartCopy':'startCopy'}(${p.idx})">📋</button><button class="list-del" onclick="deletePromo(${p.idx})">🗑️</button></div></div>`;}).join(''):'<div class="empty-state">검색 결과가 없습니다.</div>';
  ['searchView','pcSearchView'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=html;});
}

/* ── 스와이프 (모바일) ── */
function initSwipe(){
  const cw=document.getElementById('calWrap');
  let sx=0,sy=0;
  cw?.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  cw?.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40)changeMonth(dx<0?1:-1);},{passive:true});
  const lsw=document.getElementById('listSwipeWrap');
  let lsx=0,lsy=0;
  lsw?.addEventListener('touchstart',e=>{lsx=e.touches[0].clientX;lsy=e.touches[0].clientY;},{passive:true});
  lsw?.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-lsx,dy=e.changedTouches[0].clientY-lsy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40)listChangeMonth(dx<0?1:-1);},{passive:true});
}

function listChangeMonth(dir){
  const ispc=isPC();
  const mSel=document.getElementById(ispc?'pcListMonth':'listMonth');
  if(!mSel||mSel.value==='all')return;
  let y=+(document.getElementById(ispc?'pcListYear':'listYear')?.value||today.getFullYear());
  let m=parseInt(mSel.value);m+=dir;if(m<1){m=12;y--;}if(m>12){m=1;y++;}
  ['listYear','pcListYear'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=y;});
  ['listMonth','pcListMonth'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=m;});
  renderList();
}

/* ── 초기화 ── */
async function init(){
  document.getElementById('calGrid').innerHTML='<div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>불러오는 중...</div>';
  document.getElementById('pcCalGrid').innerHTML='<div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>불러오는 중...</div>';
  initSelectors();
  await loadData();
  renderCal();renderPcCal();
  setupDateInputs();
  renderSwatches('mob');renderSwatches('pc');
  initSwipe();
  initSearchYearFilter();
}
init();
</script>
